name: MobiFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobiflight/**"
      - ".github/workflows/mobiflight.yaml"
  pull_request:
    paths:
      - "mobiflight/**"
      - ".github/workflows/mobiflight.yaml"

jobs:
  build:
    name: Build devcontainer image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # To ensure since_last_remote_commit works on initial PR open

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dev container
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/neilenns/devcontainers/mobiflight
          cacheFrom: ghcr.io/neilenns/devcontainers/mobiflight
          configFile: mobiflight/devcontainer.json
          refFilterForPush: refs/heads/main
          push: filter
